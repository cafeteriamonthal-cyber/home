<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Monthal – Sleep & Coffee</title>

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --black:#050505;
  --white:#f4efe8;
  --gold:#c9a96e;
  --coffee:#7a5c44;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:'Jost',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  position:relative;
}

/* brilho central */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at center,
  rgba(122,92,68,0.18) 0%,
  rgba(122,92,68,0.08) 20%,
  transparent 65%);
  pointer-events:none;
  z-index:0;
}

/* container */

.container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:460px;
  padding:48px 24px 60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* logo */

.logo-wrap{
  width:100%;
  max-width:320px;
  margin-bottom:40px;
  animation:fadeDown .8s ease both;
}

.logo-wrap img{
  width:100%;
  display:block;
}

/* linha */

.divider{
  width:42px;
  height:1px;
  background:var(--coffee);
  margin-bottom:38px;
  opacity:.8;
  animation:fadeIn .8s .2s ease both;
}

/* links */

.links{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.link-btn{
  width:100%;
  min-height:62px;
  padding:18px 22px;
  border:1px solid rgba(201,169,110,0.22);
  text-decoration:none;
  color:var(--white);

  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:13px;
  letter-spacing:1.6px;
  text-transform:uppercase;
  font-weight:300;

  position:relative;
  overflow:hidden;

  transition:
  border-color .35s ease,
  transform .35s ease,
  color .35s ease,
  background .35s ease;
}

/* brilho hover */

.link-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
  linear-gradient(
  90deg,
  rgba(201,169,110,0.10),
  transparent
  );
  transform:translateX(-100%);
  transition:transform .45s ease;
}

.link-btn:hover::before{
  transform:translateX(0%);
}

.link-btn:hover{
  border-color:rgba(201,169,110,0.6);
  color:var(--gold);
  transform:translateY(-2px);
}

.arrow{
  font-size:16px;
  opacity:.45;
  transition:.3s ease;
}

.link-btn:hover .arrow{
  transform:translateX(4px);
  opacity:1;
}

/* footer */

.footer{
  margin-top:48px;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,.22);
}

/* animações */

@keyframes fadeDown{
  from{
    opacity:0;
    transform:translateY(-18px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scaleX(0);
  }
  to{
    opacity:1;
    transform:scaleX(1);
  }
}

/* MOBILE */

@media (max-width:640px){

  body{
    align-items:flex-start;
    justify-content:flex-start;
    padding-top:max(30px, env(safe-area-inset-top));
  }

  .container{
    max-width:100%;
    padding:
    max(34px, env(safe-area-inset-top))
    20px
    max(40px, env(safe-area-inset-bottom));
  }

  .logo-wrap{
    max-width:260px;
    margin-bottom:32px;
  }

  .divider{
    margin-bottom:30px;
  }

  .link-btn{
    min-height:60px;
    padding:18px 18px;
    font-size:12px;
    letter-spacing:1.4px;
  }

  .footer{
    margin-top:38px;
    text-align:center;
    line-height:1.7;
  }
}

/* telas muito pequenas */

@media (max-width:380px){

  .link-btn{
    font-size:11px;
    letter-spacing:1.1px;
    padding:16px;
  }

  .logo-wrap{
    max-width:220px;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->

  <div class="logo-wrap">

    <!-- TROQUE PELA SUA LOGO -->
    <img src="https://i.imgur.com/8Km9tLL.png" alt="Monthal Sleep & Coffee">

  </div>

  <div class="divider"></div>

  <!-- LINKS -->

  <div class="links">

    <a href="https://cafeteriamonthal-cyber.github.io/cardapio/"
       class="link-btn"
       target="_blank">

      <span>Cardápio Virtual</span>
      <span class="arrow">→</span>

    </a>

    <a href="https://cafeteriamonthal-cyber.github.io/cafe/"
       class="link-btn"
       target="_blank">

      <span>De Onde Vem Seu Café</span>
      <span class="arrow">→</span>

    </a>

    <a href="https://cafeteriamonthal-cyber.github.io/game/"
       class="link-btn"
       target="_blank">

      <span>Enquanto as Crianças Esperam</span>
      <span class="arrow">→</span>

    </a>

    <a href="https://search.google.com/local/writereview?placeid=ChIJwSCor2qLlwAR7Q8WxLblGPw"
       class="link-btn"
       target="_blank">

      <span>Deixe Sua Avaliação</span>
      <span class="arrow">→</span>

    </a>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © Monthal Sleep & Coffee
  </div>

</div>

</body>
</html>
