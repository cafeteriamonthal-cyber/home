<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthal – Sleep & Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #0a0a0a; --white: #f5f0eb; --coffee: #7a5c44; --gold: #c9a96e; }
  body { background-color: var(--black); color: var(--white); font-family: 'Jost', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
  body::after { content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(ellipse at center, rgba(122,92,68,0.18) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .container { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 48px 28px 60px; display: flex; flex-direction: column; align-items: center; }
  .logo-wrap { width: 100%; max-width: 320px; margin-bottom: 44px; animation: fadeDown 0.8s ease both; }
  .logo-wrap img { width: 100%; height: auto; display: block; }
  .divider { width: 40px; height: 1px; background: var(--coffee); margin-bottom: 44px; animation: scaleIn 0.6s 0.3s ease both; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .link-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 18px 26px; background: transparent; border: 1px solid rgba(201,169,110,0.25); color: var(--white); text-decoration: none; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 13.5px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.35s ease, color 0.35s ease; }
  .link-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(201,169,110,0.08) 0%, transparent 100%); transform: translateX(-100%); transition: transform 0.4s ease; }
  .link-btn:hover::before { transform: translateX(0); }
  .link-btn:hover { border-color: rgba(201,169,110,0.6); color: var(--gold); }
  .link-btn:hover .arrow { transform: translateX(4px); opacity: 1; }
  .link-btn.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .arrow { font-size: 16px; opacity: 0.4; transition: transform 0.3s ease, opacity 0.3s ease; flex-shrink: 0; margin-left: 12px; }
  .link-btn:nth-child(1) { animation: fadeUp 0.6s 0.3s ease both; }
  .link-btn:nth-child(2) { animation: fadeUp 0.6s 0.45s ease both; }
  .link-btn:nth-child(3) { animation: fadeUp 0.6s 0.6s ease both; }
  .link-btn:nth-child(4) { animation: fadeUp 0.6s 0.75s ease both; }
  .footer { margin-top: 52px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: rgba(245,240,235,0.2); animation: fadeUp 0.6s 1s ease both; }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes scaleIn { from { transform:scaleX(0); opacity:0; } to { transform:scaleX(1); opacity:1; } }
</style>
